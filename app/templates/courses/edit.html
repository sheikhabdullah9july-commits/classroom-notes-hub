{% extends 'base.html' %}

{% block title %}Edit Course - Classroom Notes{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Course</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('courses.edit', id=course.id) }}">
                    <div class="mb-3">
                        <label for="code" class="form-label">Course Code *</label>
                        <input type="text" class="form-control" id="code" name="code" 
                               value="{{ course.code }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Course Name *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ course.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4">{{ course.description }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> Update Course
                        </button>
                        <a href="{{ url_for('courses.view', id=course.id) }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
                
                {% if current_user.role == 'admin' %}
                <hr>
                <div class="text-end">
                    <form method="POST" action="{{ url_for('courses.delete', id=course.id) }}" 
                          onsubmit="return confirm('Are you sure you want to delete this course?');">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Delete Course
                        </button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
