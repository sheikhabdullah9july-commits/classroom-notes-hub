{% extends 'base.html' %}

{% block title %}{{ room.name }} - Chat{% endblock %}

{% block content %}
<div class="card shadow" style="height: 75vh;">
    <!-- Header -->
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="bi bi-chat-dots"></i> {{ room.name }}</h5>
            <small>{{ room.room_type }} chat</small>
        </div>
        <a href="{{ url_for('chat.index') }}" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
    
    <!-- Messages -->
    <div class="card-body overflow-auto" id="messages-container" style="flex: 1;">
        {% for msg in messages %}
        <div class="d-flex mb-3 {{ 'justify-content-end' if msg.user_id == current_user.id else '' }}">
            <div class="card {{ 'bg-primary text-white' if msg.user_id == current_user.id else 'bg-light' }}"
                 style="max-width: 70%;">
                <div class="card-body py-2 px-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <strong class="small">{{ msg.sender.username }}</strong>
                        <small class="ms-2 {{ 'text-white-50' if msg.user_id == current_user.id else 'text-muted' }}">
                            {{ msg.created_at.strftime('%H:%M') }}
                        </small>
                    </div>
                    <p class="mb-0">{{ msg.content }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
        <div id="new-messages"></div>
    </div>
    
    <!-- Input -->
    <div class="card-footer">
        <form id="message-form" class="d-flex gap-2">
            <input type="text" id="message-input" class="form-control" 
                   placeholder="Type your message..." autocomplete="off" required>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-send"></i>
            </button>
        </form>
    </div>
</div>

<!-- SocketIO Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const roomId = {{ room.id }};
    const currentUserId = {{ current_user.id }};
    const currentUsername = "{{ current_user.username }}";
    
    // Join room on connect
    socket.on('connect', function() {
        socket.emit('join', {room: roomId});
    });
    
    // Receive message
    socket.on('message', function(data) {
        const messagesDiv = document.getElementById('new-messages');
        const isOwn = data.user_id === currentUserId;
        
        const msgHtml = `
            <div class="d-flex mb-3 ${isOwn ? 'justify-content-end' : ''}">
                <div class="card ${isOwn ? 'bg-primary text-white' : 'bg-light'}" style="max-width: 70%;">
                    <div class="card-body py-2 px-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="small">${data.user}</strong>
                            <small class="ms-2 ${isOwn ? 'text-white-50' : 'text-muted'}">${data.time}</small>
                        </div>
                        <p class="mb-0">${data.msg}</p>
                    </div>
                </div>
            </div>
        `;
        messagesDiv.insertAdjacentHTML('beforeend', msgHtml);
        scrollToBottom();
    });
    
    // Status messages (join/leave)
    socket.on('status', function(data) {
        const messagesDiv = document.getElementById('new-messages');
        const statusHtml = `
            <div class="text-center mb-2">
                <small class="text-muted"><em>${data.msg}</em></small>
            </div>
        `;
        messagesDiv.insertAdjacentHTML('beforeend', statusHtml);
        scrollToBottom();
    });
    
    // Send message
    document.getElementById('message-form').onsubmit = function(e) {
        e.preventDefault();
        const input = document.getElementById('message-input');
        const msg = input.value.trim();
        
        if (msg) {
            socket.emit('message', {room: roomId, msg: msg});
            input.value = '';
        }
    };
    
    // Scroll to bottom
    function scrollToBottom() {
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
    }
    
    // Leave room on page unload
    window.onbeforeunload = function() {
        socket.emit('leave', {room: roomId});
    };
    
    // Initial scroll
    scrollToBottom();
</script>
{% endblock %}
